# What the gateway does with each kind of PII.
#   tokenize -> replace with a placeholder like <PERSON_1>, restore it in the answer
#   redact   -> replace with [REDACTED_<TYPE>], never restored
#   block    -> reject the whole request; this data must never leave
#   allow    -> do nothing (entity is not scanned for at all)
#
# Entity types not listed here are not scanned for.
# Changing an action needs a server restart.

score_threshold: 0.5      # ignore detections below this confidence

entities:
  # --- too sensitive to send even as a placeholder context ---
  CREDIT_CARD: block
  IN_PASSPORT: block
  IN_VOTER_ID: block
  API_KEY: block

  # --- removed for good: the rest of the message still goes through ---
  IN_AADHAAR: redact
  IN_PAN: redact
  IN_DRIVING_LICENCE: redact

  # --- replaced with placeholders, restored in the answer ---
  PERSON: tokenize
  IN_IFSC: tokenize
  BANK_ACCOUNT: tokenize
  DATE_OF_BIRTH: tokenize
  PIN_CODE: tokenize
  PASSWORD: tokenize        # found by keyword, so a false match must not block
  EMAIL_ADDRESS: tokenize
  IN_PHONE: tokenize
  PHONE_NUMBER: tokenize
  UPI_ID: tokenize
  IP_ADDRESS: tokenize
  LOCATION: tokenize

  # --- explicitly allowed (dates are needed for most real tasks) ---
  DATE_TIME: allow
